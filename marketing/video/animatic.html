<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Animatic pedidos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: 'Inter', 'Noto Color Emoji', sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .center { left: 0; right: 0; text-align: center; }
  .sub {
    position: absolute; left: 70px; right: 70px; top: 1530px; text-align: center;
    font-size: 44px; font-weight: 700; line-height: 1.25;
    text-shadow: 0 2px 4px #000; background: rgba(0,0,0,.55); padding: 14px 22px; border-radius: 18px;
  }
  .tag {
    position: absolute; left: 40px; top: 1470px; font-size: 22px; font-weight: 600; letter-spacing: 1px;
    padding: 8px 14px; border-radius: 8px; background: rgba(0,0,0,.55); color: #ffd166; border: 2px dashed #ffd166;
  }
  .pill { display: inline-block; padding: 14px 30px; border-radius: 999px; font-weight: 800; }
  .phone { position: absolute; left: 240px; top: 420px; width: 600px; height: 1080px; border-radius: 70px;
    background: #111; box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 0 0 4px #333; }
  .screen { position: absolute; left: 18px; top: 18px; width: 564px; height: 1044px; border-radius: 54px; overflow: hidden; background: #f4f6f5; color: #1b1f1d; }
  .notch { position: absolute; left: 50%; top: 14px; width: 150px; height: 34px; margin-left: -75px; background: #111; border-radius: 20px; z-index: 5; }
  .row { position: absolute; left: 16px; right: 16px; height: 118px; background: #fff; border-radius: 22px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .btn { position: absolute; width: 62px; height: 62px; border-radius: 18px; font-size: 40px; font-weight: 800; line-height: 60px; text-align: center; }
  .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: rgba(255,255,255,.55); border: 5px solid rgba(255,255,255,.95); box-shadow: 0 0 0 6px rgba(0,0,0,.15); z-index: 50; }
</style>
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute">
  <filter id="grain"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
</svg>
<script>
const BRAND = '#0e7c66', BRAND_D = '#09594a', ACC = '#ffb703';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const fade = (t, a, b, f = 0.25) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const money = n => '$ ' + n.toLocaleString('es-AR');

const PRODUCTS = [
  { e: '🥤', n: 'Coca-Cola 2,25 L', u: 'Pack x6', p: 21600 },
  { e: '🥤', n: 'Coca-Cola Zero 2,25 L', u: 'Pack x6', p: 21600 },
  { e: '💧', n: 'Agua mineral 500 ml', u: 'Pack x12', p: 7900 },
  { e: '🍝', n: 'Fideos spaghetti 500 g', u: 'Bulto x10', p: 11500 },
  { e: '🧉', n: 'Yerba mate 1 kg', u: 'Bulto x10', p: 42000 },
  { e: '🌻', n: 'Aceite girasol 1,5 L', u: 'Pack x6', p: 24300 },
];
// [time, productIndex, delta]
const TAPS = [[12.3, 0, 1], [12.9, 0, 1], [13.6, 2, 1], [14.3, 3, 1], [14.9, 3, 1], [15.6, 4, 1]];
const MINUS_T = 18.4; // quita 1 fideos en el carrito
const CONFIRM_T = 20.3;

const SUBS = [
  [0.1, 3, '¿Otra vez un audio de cinco minutos para hacer el pedido?'],
  [3, 5, 'Listas, fotos, “después te confirmo”...'],
  [5, 6.1, 'Pará. Hay una forma mucho más fácil.'],
  [6.1, 10, 'Entrás a la web de pedidos y tenés todo el catálogo ordenado, con precios al día.'],
  [10, 12, 'Buscás lo que necesitás...'],
  [12, 17, '...tocás más, tocás menos, y ves el total en el momento. Sin sorpresas.'],
  [17, 20, 'Revisás todo antes de mandarlo...'],
  [20, 22, '...y confirmás. Menos de dos minutos.'],
  [22, 26, 'Tu pedido entra directo al depósito y sale en el próximo reparto.'],
  [26, 28, 'Sin audios. Sin planillas. Sin vueltas.'],
  [28, 30, 'Entrá hoy y hacé tu pedido en dos minutos.'],
];

function qtys(t) {
  const q = PRODUCTS.map(() => 0);
  for (const [tt, i, d] of TAPS) if (t >= tt) q[i] += d;
  if (t >= MINUS_T) q[3] -= 1;
  return q;
}
const total = q => q.reduce((s, n, i) => s + n * PRODUCTS[i].p, 0);
const tapEl = (t, at, x, y) => {
  const p = prog(t, at - 0.15, at + 0.35);
  if (p <= 0 || p >= 1) return '';
  const s = p < 0.3 ? 0.7 + p : 1 - (p - 0.3) * 0.4, o = p < 0.3 ? p / 0.3 : 1 - (p - 0.3) / 0.7;
  return `<div class="tap" style="left:${x}px;top:${y}px;transform:scale(${s});opacity:${o}"></div>`;
};

// ---------- escena 1–2: el caos ----------
function sceneChaos(t, frame) {
  let h = `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 40%,#5a5148,#221e1a);filter:grayscale(.75) contrast(1.1)">`;
  // remitos de fondo
  for (let i = 0; i < 7; i++) {
    const r = (i * 37) % 30 - 15;
    h += `<div class="abs" style="left:${120 + (i * 131) % 700}px;top:${380 + (i * 173) % 900}px;width:330px;height:420px;background:#e9e2d0;transform:rotate(${r}deg);box-shadow:0 8px 20px rgba(0,0,0,.4);padding:30px;color:#555;font:600 26px 'DejaVu Sans Mono',monospace;line-height:1.6">REMITO<br>coca x12??<br>fideos x24<br>yerba ... <br>~~aceite~~</div>`;
  }
  if (t < 3) {
    // celular con audio de 4:37
    const drop = easeOut(prog(t, 2.2, 2.8));
    h += `<div class="phone" style="left:260px;top:${520 + drop * 120}px;width:560px;height:980px;transform:rotate(${-4 + drop * 10}deg)">
      <div class="screen" style="width:524px;height:944px;background:#e5ddd5">
        <div style="background:#075e54;color:#fff;height:120px;padding:60px 30px 0;font:700 32px Inter">Distribuidora 🚚</div>
        ${[0, 1, 2].map(i => `<div class="abs" style="left:24px;top:${170 + i * 150}px;width:420px;height:110px;background:${i === 2 ? '#dcf8c6' : '#fff'};border-radius:18px;padding:22px;color:#333;font:600 28px Inter;display:flex;align-items:center;gap:18px">
          <span style="font-size:40px">▶️</span><span style="flex:1;height:8px;background:#aaa;border-radius:4px"></span><span>${['1:12', '3:05', '4:37'][i]}</span></div>`).join('')}
        <div class="abs" style="left:24px;top:640px;width:300px;height:80px;background:#fff;border-radius:18px;padding:22px;color:#333;font:600 28px Inter">¿te llegó? 🙏</div>
      </div><div class="notch"></div></div>`;
    const shake = Math.sin(t * 70) * 14 * (1 - prog(t, 0.2, 1.1));
    const s = back(prog(t, 0.1, 0.5));
    h += `<div class="abs center" style="top:270px;transform:translateX(${shake}px) scale(${s})"><span class="pill" style="background:#fff;color:#111;font-size:58px;padding:22px 34px">¿Seguís pidiendo<br>mercadería así? 😩</span></div>`;
  } else {
    const stickers = ['❌ ¿x12 o x24?', '📝 Lista en papel', '❌ ¿Llegó?', '📸 Foto borrosa', '❌ Sin precio', '📦 Caja equivocada'];
    stickers.forEach((s, i) => {
      const a = 3 + i * 0.3;
      if (t < a) return;
      const sc = back(prog(t, a, a + 0.18));
      h += `<div class="abs" style="left:${[90, 470, 160, 520, 120, 430][i]}px;top:${[330, 520, 760, 980, 1180, 1340][i]}px;transform:rotate(${[-8, 6, -4, 9, -6, 4][i]}deg) scale(${sc})">
        <span class="pill" style="background:#e63946;color:#fff;font-size:52px;box-shadow:0 10px 0 #8d1c25">${s}</span></div>`;
    });
  }
  h += `</div><div class="abs" style="inset:0;filter:url(#grain);opacity:.22;background:#fff;mix-blend-mode:overlay"></div>`;
  return h;
}

// ---------- escena 3: corte seco ----------
function sceneSwipe(t) {
  const y = (1 - easeOut(prog(t, 5, 5.35))) * 1920;
  const s = back(prog(t, 5.3, 5.65));
  return `<div class="abs" style="left:0;right:0;top:${y}px;height:1920px;background:linear-gradient(160deg,${BRAND},${BRAND_D})">
    <div class="abs center" style="top:760px;transform:scale(${s})">
      <div style="font-size:150px">🛒</div>
      <div style="font-size:84px;font-weight:900;letter-spacing:-2px">LA Distribuciones</div>
      <div style="margin-top:26px"><span class="pill" style="background:${ACC};color:#222;font-size:44px">pedidos.html</span></div>
    </div></div>`;
}

// ---------- escena 4: la web ----------
const PX = 240 + 18, PY = 420 + 18; // origen de la pantalla
function screenCatalog(t) {
  const searching = t >= 10 && t < 12;
  const typed = 'coca'.slice(0, Math.floor(prog(t, 10.3, 11.1) * 4.99));
  const list = searching && typed.length >= 2 ? PRODUCTS.filter(p => p.n.toLowerCase().includes(typed)) : PRODUCTS;
  const q = qtys(t);
  const scroll = t < 10 ? Math.sin(prog(t, 7, 9.6) * Math.PI) * 160 : 0;
  const chips = ['Bebidas', 'Almacén', 'Lácteos', 'Limpieza', 'Kiosco'];
  const activeChip = t < 10 ? Math.floor(prog(t, 6.6, 9.6) * 3.99) % 4 : 0;
  const count = q.reduce((a, b) => a + b, 0);
  const lastTap = TAPS.filter(x => x[0] <= t).pop();
  const bump = lastTap ? 1 + 0.35 * Math.max(0, 1 - (t - lastTap[0]) / 0.25) : 1;
  let h = `<div class="abs" style="left:0;right:0;top:0;height:150px;background:${BRAND};color:#fff;padding:66px 26px 0;display:flex;justify-content:space-between;font-weight:800;font-size:32px">
      <span>LA Distribuciones</span>
      <span style="position:relative;font-size:38px;transform:scale(${bump});display:inline-block">🛒${count ? `<b style="position:absolute;right:-16px;top:-12px;background:${ACC};color:#222;font-size:22px;border-radius:999px;padding:2px 10px">${count}</b>` : ''}</span></div>
    <div class="abs" style="left:16px;right:16px;top:166px;height:70px;background:#fff;border-radius:18px;border:3px solid ${searching ? BRAND : '#dde3e0'};padding:16px 20px;font-size:30px;color:${typed ? '#111' : '#8a938f'}">🔍 ${typed || 'Buscar producto...'}${searching && Math.floor(t * 3) % 2 ? '|' : ''}</div>
    <div class="abs" style="left:16px;top:252px;white-space:nowrap">${chips.map((c, i) => `<span style="display:inline-block;margin-right:10px;padding:10px 20px;border-radius:999px;font-size:24px;font-weight:700;background:${i === activeChip ? BRAND : '#e3e9e6'};color:${i === activeChip ? '#fff' : '#33403a'}">${c}</span>`).join('')}</div>
    <div class="abs" style="left:0;right:0;top:318px;bottom:110px;overflow:hidden"><div class="abs" style="left:0;right:0;top:${-scroll}px">`;
  list.forEach((p, k) => {
    const i = PRODUCTS.indexOf(p), top = k * 130;
    h += `<div class="row" style="top:${top}px">
      <div class="abs" style="left:14px;top:18px;width:82px;height:82px;border-radius:18px;background:#eef3f1;font-size:50px;text-align:center;line-height:82px">${p.e}</div>
      <div class="abs" style="left:112px;top:18px;width:205px;font-size:22px;font-weight:700;line-height:1.2">${p.n}</div>
      <div class="abs" style="left:112px;top:80px;font-size:22px;color:#6a746f">${p.u} · <b style="color:${BRAND}">${money(p.p)}</b></div>
      ${q[i] ? `<div class="btn" style="left:330px;top:28px;background:#eef3f1;color:#333">−</div><div class="abs" style="left:396px;top:36px;width:50px;text-align:center;font-size:36px;font-weight:800">${q[i]}</div>` : ''}
      <div class="btn" style="left:450px;top:28px;background:${BRAND};color:#fff">+</div></div>`;
  });
  h += `</div></div>
    <div class="abs" style="left:0;right:0;bottom:0;height:110px;background:#fff;box-shadow:0 -4px 12px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 24px">
      <div><div style="font-size:20px;color:#6a746f">Subtotal</div><div style="font-size:36px;font-weight:900">${money(total(q))}</div></div>
      <span class="pill" style="background:${ACC};color:#222;font-size:26px">Ver carrito →</span></div>`;
  // toques
  for (const [tt, i] of TAPS) h += tapEl(t, tt, 16 + 450 + 31, 318 + PRODUCTS.indexOf(PRODUCTS[i]) * 130 + 28 + 31);
  h += tapEl(t, 16.7, 440, 1044 - 55);
  return h;
}

function screenCart(t) {
  const q = qtys(t), items = PRODUCTS.map((p, i) => [p, q[i], i]).filter(x => x[1] > 0);
  const sent = t >= CONFIRM_T + 0.2;
  let h = `<div class="abs" style="left:0;right:0;top:0;height:150px;background:${BRAND};color:#fff;padding:66px 26px 0;font-weight:800;font-size:34px">← Tu pedido</div>`;
  items.forEach(([p, n, i], k) => {
    const flash = i === 3 ? Math.max(0, 1 - Math.abs(t - MINUS_T) / 0.3) : 0;
    h += `<div class="row" style="top:${170 + k * 130}px;background:rgba(${255 - flash * 30},${255 - flash * 10},${255 - flash * 60},1)">
      <div class="abs" style="left:14px;top:18px;width:82px;height:82px;border-radius:18px;background:#eef3f1;font-size:50px;text-align:center;line-height:82px">${p.e}</div>
      <div class="abs" style="left:112px;top:18px;width:220px;font-size:22px;font-weight:700">${p.n}</div>
      <div class="abs" style="left:112px;top:76px;font-size:24px;color:#6a746f">${n} × ${money(p.p)}</div>
      <div class="abs" style="right:20px;top:20px;font-size:26px;font-weight:900">${money(n * p.p)}</div>
      <div class="btn" style="left:350px;top:50px;width:52px;height:52px;line-height:50px;font-size:34px;background:#eef3f1;color:#333">−</div>
      <div class="abs" style="left:410px;top:58px;width:40px;text-align:center;font-size:30px;font-weight:800">${n}</div>
      <div class="btn" style="left:456px;top:50px;width:52px;height:52px;line-height:50px;font-size:34px;background:${BRAND};color:#fff">+</div></div>`;
  });
  const hl = t >= 17.4 && t < 20 ? `box-shadow:0 0 0 6px ${ACC};` : '';
  h += `<div class="abs" style="left:16px;right:16px;top:${170 + items.length * 130 + 10}px;padding:22px;border-radius:20px;background:#fff;${hl}display:flex;justify-content:space-between;font-size:34px;font-weight:900"><span>Total</span><span>${money(total(q))}</span></div>
    <div class="abs" style="left:24px;right:24px;bottom:34px;height:96px;border-radius:24px;background:${BRAND};color:#fff;font-size:36px;font-weight:900;text-align:center;line-height:96px;transform:scale(${t > CONFIRM_T && t < CONFIRM_T + 0.2 ? 0.95 : 1})">Confirmar pedido ✓</div>`;
  h += tapEl(t, MINUS_T, 16 + 350 + 26, 170 + 2 * 130 + 50 + 26);
  h += tapEl(t, CONFIRM_T, 282, 1044 - 34 - 48);
  if (sent) {
    const s = back(prog(t, CONFIRM_T + 0.2, CONFIRM_T + 0.6));
    h += `<div class="abs" style="inset:0;background:rgba(255,255,255,${0.96 * prog(t, CONFIRM_T + 0.2, CONFIRM_T + 0.4)});text-align:center;padding-top:300px">
      <div style="display:inline-block;width:220px;height:220px;border-radius:50%;background:#2bb673;color:#fff;font-size:140px;line-height:220px;font-weight:900;transform:scale(${s})">✓</div>
      <div style="margin-top:40px;font-size:46px;font-weight:900;opacity:${prog(t, CONFIRM_T + 0.5, CONFIRM_T + 0.8)}">¡Pedido enviado!</div>
      <div style="margin-top:14px;font-size:28px;color:#555;opacity:${prog(t, CONFIRM_T + 0.6, CONFIRM_T + 0.9)}">N° 10482 · Sale en el próximo reparto</div></div>`;
  }
  return h;
}

function sceneWeb(t) {
  const enter = easeOut(prog(t, 6, 6.5));
  let h = `<div class="abs" style="inset:0;background:linear-gradient(170deg,#e9f5f1,#cfe9e1)"></div>
    <div class="phone" style="transform:translateY(${(1 - enter) * 900}px)"><div class="screen">${t < 17 ? screenCatalog(t) : screenCart(t)}</div><div class="notch"></div></div>`;
  // cronómetro
  if (t >= 10) {
    const secs = Math.round(prog(t, 10, CONFIRM_T) * 107);
    const mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
    const big = easeOut(prog(t, CONFIRM_T + 0.3, CONFIRM_T + 0.7));
    const x = 760 - big * 220, y = 300 + big * 0, sc = 1 + big * 0.9;
    h += `<div class="abs" style="left:${x}px;top:${y}px;transform:scale(${sc});transform-origin:center;background:#111;color:#fff;border-radius:22px;padding:12px 24px;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 8px 20px rgba(0,0,0,.25);border:4px solid ${t >= CONFIRM_T ? '#2bb673' : '#111'}">⏱ ${mm}:${ss}</div>`;
  }
  // callouts arriba del teléfono
  const call = (a, b, txt, bg = BRAND, fg = '#fff') => {
    const o = fade(t, a, b);
    return o > 0 ? `<div class="abs" style="left:60px;top:300px;opacity:${o};transform:translateX(${(1 - easeOut(prog(t, a, a + 0.3))) * -60}px)"><span class="pill" style="background:${bg};color:${fg};font-size:44px">${txt}</span></div>` : '';
  };
  h += call(6.4, 8.2, '📱 Catálogo completo') + call(8.2, 10, '💲 Precios actualizados', ACC, '#222');
  h += call(17.2, 20, '✔ Vos controlás todo');
  // pop-ups +N
  TAPS.forEach(([tt, i]) => {
    const p = prog(t, tt, tt + 0.8);
    if (p <= 0 || p >= 1) return;
    h += `<div class="abs" style="left:870px;top:${PY + 318 + i * 130 + 30 - p * 80}px;opacity:${1 - p * p};font-size:34px;font-weight:900;color:${BRAND_D};background:#fff;border-radius:14px;padding:6px 14px;box-shadow:0 4px 10px rgba(0,0,0,.15)">+1 ${PRODUCTS[i].u.split(' ')[0]}</div>`;
  });
  h += `<div class="tag">MAQUETA · reemplazar por grabación real de pedidos.html</div>`;
  return h;
}

// ---------- escena 5: depósito ----------
function sceneWarehouse(t) {
  let h = `<div class="abs" style="inset:0;background:linear-gradient(180deg,#1d2b33 0%,#2f4450 60%,#5b4a3a 60%,#3e3328 100%)"></div>`;
  // luz entrando
  h += `<div class="abs" style="left:620px;top:0;width:460px;height:1920px;background:linear-gradient(100deg,rgba(255,220,150,.0),rgba(255,220,150,.28),rgba(255,220,150,0));transform:skewX(-12deg)"></div>`;
  // racks
  for (let c = 0; c < 2; c++) for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++)
    h += `<div class="abs" style="left:${60 + c * 300 + k * 88}px;top:${300 + r * 160}px;width:80px;height:110px;background:${['#c8955a', '#b07d45', '#d9a86c'][(r + k + c) % 3]};border:3px solid #7a5530;border-radius:6px"></div>`;
  for (let c = 0; c < 2; c++) for (let r = 0; r <= 5; r++)
    h += `<div class="abs" style="left:${50 + c * 300}px;top:${414 + (r - 1) * 160 + 2}px;width:280px;height:12px;background:#e37222"></div>`;
  // pallet que se desplaza
  const px = 300 + easeOut(prog(t, 22.3, 24)) * 260;
  h += `<div class="abs" style="left:${px}px;top:1040px;font-size:110px;line-height:1">📦📦<br>📦📦</div>`;
  // camión
  const tx = -380 + prog(t, 23.6, 26) * 1500;
  h += `<div class="abs" style="left:${tx}px;top:1080px;font-size:300px;transform:scaleX(-1)">🚚</div>`;
  const s1 = fade(t, 22.2, 24.2), s2 = fade(t, 24, 26.2);
  if (s1 > 0) h += `<div class="abs center" style="top:300px;opacity:${s1}"><span class="pill" style="background:#fff;color:#111;font-size:56px">📦 Directo a depósito</span></div>`;
  if (s2 > 0) h += `<div class="abs center" style="top:300px;opacity:${s2}"><span class="pill" style="background:${ACC};color:#111;font-size:56px">🚚 Sale en el reparto</span></div>`;
  h += `<div class="tag">TOMA IA · depósito / camión (Kling · Runway)</div>`;
  return h;
}

// ---------- escena 6: el comercio ----------
function sceneStore(t) {
  let h = `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 55%,#ffe8c2,#f2b56b)"></div>
    <div class="abs center" style="top:${780 + Math.sin(t * 3) * 8}px;font-size:300px">🏪</div>
    <div class="abs" style="left:640px;top:1110px;font-size:150px;transform:rotate(${Math.sin(t * 2) * 6}deg)">🧉</div>`;
  ['Sin audios.', 'Sin planillas.', 'Sin vueltas.'].forEach((w, i) => {
    const a = 26.1 + i * 0.45, s = back(prog(t, a, a + 0.3));
    if (t >= a) h += `<div class="abs center" style="top:${300 + i * 120}px;transform:scale(${s})"><span class="pill" style="background:${i === 2 ? BRAND : '#fff'};color:${i === 2 ? '#fff' : '#111'};font-size:66px;padding:12px 34px">${w}</span></div>`;
  });
  h += `<div class="tag">TOMA REAL · comerciante recibiendo el pedido</div>`;
  return h;
}

// ---------- escena 7: placa final ----------
function sceneEnd(t) {
  const s = back(prog(t, 28, 28.4)), pulse = 1 + 0.06 * Math.sin((t - 28) * 9);
  return `<div class="abs" style="inset:0;background:linear-gradient(160deg,${BRAND},${BRAND_D})"></div>
    <div class="abs center" style="top:340px;transform:scale(${s})">
      <div style="font-size:130px">🛒</div>
      <div style="font-size:80px;font-weight:900;letter-spacing:-2px">LA Distribuciones</div>
      <div style="margin-top:60px;font-size:60px;font-weight:800;line-height:1.2">Hacé tu pedido<br>en 2 minutos ⏱️</div>
      <div style="margin:60px 60px 0;padding:28px;border-radius:28px;background:rgba(255,255,255,.14);font-size:46px;font-weight:800;word-break:break-all">👉 ladistribuciones.web.app<br>/pedidos.html</div>
      <div style="margin-top:70px;transform:scale(${pulse})"><span class="pill" style="background:${ACC};color:#222;font-size:64px;padding:26px 70px;box-shadow:0 12px 0 #c48a00">PEDIR AHORA</span></div>
    </div>`;
}

function render(t, frame = 0) {
  document.getElementById('turb').setAttribute('seed', frame % 50);
  let h;
  if (t < 5) h = sceneChaos(t, frame);
  else if (t < 6) h = sceneChaos(4.99, frame) + sceneSwipe(t);
  else if (t < 22) h = sceneWeb(t);
  else if (t < 26) h = sceneWarehouse(t);
  else if (t < 28) h = sceneStore(t);
  else h = sceneEnd(t);
  // flash blanco en cortes
  for (const c of [22, 26, 28]) { const o = 1 - prog(Math.abs(t - c), 0, 0.12); if (o > 0) h += `<div class="abs" style="inset:0;background:#fff;opacity:${o * 0.8}"></div>`; }
  const sub = SUBS.find(([a, b]) => t >= a && t < b);
  if (sub) h += `<div class="sub">${sub[2]}</div>`;
  document.getElementById('stage').innerHTML = h;
}
window.render = render;
// vista previa en el navegador: reproduce en bucle
if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = () => { const t = ((performance.now() - t0) / 1000) % 30; render(t, Math.floor(t * 30)); requestAnimationFrame(loop); };
  document.body.style.transformOrigin = '0 0';
  const fit = () => document.body.style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`;
  addEventListener('resize', fit); fit(); loop();
}
</script>
